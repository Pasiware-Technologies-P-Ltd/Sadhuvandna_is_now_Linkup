version: '3.8'

services:
  # 1. Redis Server
  redis:
    image: redis:alpine
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          redis-server --requirepass "$$REDIS_PASSWORD"
        else
          redis-server --protected-mode no
        fi
      '
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    networks:
      - coolify

  # 2. Main PHP API (Replaces: php -S 0.0.0.0:8000 -t Api)
  api-server:
    build: 
      context: ./backend
      dockerfile: Dockerfile.php
    ports:
      - "8078:80"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - SOCKET_URL=http://socket-server:3000
      - DB_HOST=${DB_HOST:-e4skgkwwk0s0gkso48oc40kg}
      - DB_USER=${DB_USER:-u941015828_sadhuvandna}
      - DB_PASS=${DB_PASS:-Sadhuvandna7832%^}
      - DB_NAME=${DB_NAME:-u941015828_sadhuvandna}
      - DB_PORT=${DB_PORT:-3306}
    volumes:
      - uploads-volume:/var/www/html/Api/uploads
      - uploads-volume:/var/www/html/uploads
    networks:
      - coolify
    depends_on:
      - redis

  # 3. Queue Worker (Replaces: php Api/worker.php)
  php-worker:
    build: 
      context: ./backend
      dockerfile: Dockerfile.php
    command: php /var/www/html/Api/worker.php
    environment:
      - APP_ENV=${APP_ENV:-production}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - DB_HOST=${DB_HOST:-e4skgkwwk0s0gkso48oc40kg}
      - DB_USER=${DB_USER:-u941015828_sadhuvandna}
      - DB_PASS=${DB_PASS:-Sadhuvandna7832%^}
      - DB_NAME=${DB_NAME:-u941015828_sadhuvandna}
      - DB_PORT=${DB_PORT:-3306}
    networks:
      - coolify
    depends_on:
      - redis

  # 4. Notification Worker (Replaces: php Api/notification_worker.php)
  php-notification-worker:
    build: 
      context: ./backend
      dockerfile: Dockerfile.php
    command: php /var/www/html/Api/notification_worker.php
    environment:
      - APP_ENV=${APP_ENV:-production}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - SOCKET_URL=http://socket-server:3000
      - DB_HOST=${DB_HOST:-e4skgkwwk0s0gkso48oc40kg}
      - DB_USER=${DB_USER:-u941015828_sadhuvandna}
      - DB_PASS=${DB_PASS:-Sadhuvandna7832%^}
      - DB_NAME=${DB_NAME:-u941015828_sadhuvandna}
      - DB_PORT=${DB_PORT:-3306}
    networks:
      - coolify
    depends_on:
      - redis

  # 5. Socket Server (Replaces: node server/index.js)
  socket-server:
    build: 
      context: ./backend
      dockerfile: Dockerfile.node
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api-server
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.socket-server.rule=Host(`ws.sadhuvandna.co.in`)"
      - "traefik.http.routers.socket-server.entrypoints=https"
      - "traefik.http.routers.socket-server.tls=true"
      - "traefik.http.routers.socket-server.tls.certresolver=letsencrypt"
      - "traefik.http.services.socket-server.loadbalancer.server.port=3000"
    networks:
      - coolify
    depends_on:
      - redis

  # 6. Web & Admin Portal (Replaces standard web hosting)
  web-portal:
    build: 
      context: ../web
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_HOST=${DB_HOST:-e4skgkwwk0s0gkso48oc40kg}
      - DB_USER=${DB_USER:-u941015828_sadhuvandna}
      - DB_PASS=${DB_PASS:-Sadhuvandna7832%^}
      - DB_NAME=${DB_NAME:-u941015828_sadhuvandna}
      - DB_PORT=${DB_PORT:-3306}
    volumes:
      - uploads-volume:/var/www/html/uploads
    networks:
      - coolify

networks:
  coolify:
    external: true

volumes:
  uploads-volume:
    name: ugoko000c444w0kwwk84coc0-uploads-volume
    external: true