version: '3.8'

services:
  web-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linkup-web-admin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_HOST=${DB_HOST:-e4skgkwwk0s0gkso48oc40kg}
      - DB_USER=${DB_USER:-u941015828_sadhuvandna}
      - DB_PASS=${DB_PASS:-Sadhuvandna7832%^}
      - DB_NAME=${DB_NAME:-u941015828_sadhuvandna}
      - DB_PORT=${DB_PORT:-3306}
    volumes:
      - web-uploads:/var/www/html/uploads
      - web-images:/var/www/html/images
    networks:
      - web-network

networks:
  web-network:
    driver: bridge

volumes:
  web-uploads:
  web-images:
